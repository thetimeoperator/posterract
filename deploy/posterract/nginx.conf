server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /editor-sandbox/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Desktop builds are bind-mounted from the host, not baked into the image.
  # =404 rather than the SPA fallback: a missing build must not hand the browser
  # an index.html that it saves as a corrupt .dmg.
  location /releases/ {
    alias /srv/downloads/;
    try_files $uri =404;
    types { application/x-apple-diskimage dmg; application/zip zip; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
