server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Desktop builds are bind-mounted from the host, not baked into the image.
  # =404 rather than the SPA fallback: a missing build must not hand the browser
  # an index.html that it saves as a corrupt .dmg.
  location /releases/ {
    alias /srv/downloads/;
    try_files $uri =404;
    types { application/x-apple-diskimage dmg; application/zip zip; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600";
  }

  # Sign-in discovery for AI connectors such as Meta Muse lives at the site's
  # root; the API answers it (apps/api/src/mcp/auth.js). Resolved per request,
  # so this server starts even while the API is down.
  location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $posterract_api http://api:3001;
    proxy_pass $posterract_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The page itself is always checked with the server (a 304 when nothing changed),
  # so a deploy reaches everyone on their next load instead of after a browser's guess.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
